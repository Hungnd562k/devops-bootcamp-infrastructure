# Install the monolithic Helm chart
# Using single replica

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    # Keep non-default namespace logs for the minimum supported retention period.
    retention_period: 24h
    # Prioritize logs from the default namespace and keep them for up to 3 days.
    retention_stream:
      - selector: '{namespace="default"}'
        priority: 10
        period: 72h
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 20
    delete_request_store: s3
  rulerConfig:
    enable_api: true

ignoreMinioDeprecation: true  # Temporary workaround – MinIO will be removed 2026-10-31

storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
    persistentVolume:
      enabled: true
      storageClassName: local-path

minio:
  enabled: true
      
deploymentMode: SingleBinary

singleBinary:
  replicas: 1

gateway:
  enabled: true
  nginxConfig:
    resolver: "10.43.0.10" # IP DNS server

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
